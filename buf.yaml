version: v2
modules:
  - path: proto
    excludes:
      - proto/third_party
    lint:
      use:
        - STANDARD
      # The §4.4 contract names Scorer, Decision, Case, Timeline, RuleSet, ShadowSummary and LiveMetrics
      # explicitly; see docs/DECISIONS.md D-004.
      except:
        - RPC_REQUEST_RESPONSE_UNIQUE
        - RPC_RESPONSE_STANDARD_NAME
        - SERVICE_SUFFIX
    breaking:
      use:
        - FILE
  - path: proto/third_party
    lint:
      ignore:
        - proto/third_party
