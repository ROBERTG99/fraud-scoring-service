# Test infrastructure for `make test` (host) and `make test-docker` (containers).
name: fraudtest

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
      POSTGRES_DB: fraud
    ports: ["127.0.0.1:8521:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "max_connections=400"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:8531:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  redpanda:
    image: redpandadata/redpanda:v25.2.9
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:8543
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:8543
    ports: ["127.0.0.1:8543:8543"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 40

  # `make test-docker`: the full suite inside a container, on the services above (profile docker, so
  # `make test` on the host starts only the backing services).
  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
      network: ${COMPOSE_BUILD_NETWORK:-default}
      args:
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
    image: fraud/tests:dev
    profiles: [docker]
    environment:
      FRAUD_TEST_PG_DSN: postgres://fraud:fraud@postgres:5432/fraud?sslmode=disable
      FRAUD_TEST_REDIS_ADDR: redis:6379
      FRAUD_TEST_KAFKA_BROKERS: redpanda:9092
      # pytest-socket allows loopback by default; the services are other containers here.
      PYTEST_ADDOPTS: --allow-hosts=127.0.0.1,localhost,::1,postgres,redis,redpanda
      # Fewer race-instrumented packages at once inside the Docker VM, so the integration tests that assert
      # the 8 ms Redis budget are not starved of CPU (D-073).
      GOFLAGS: -p=4
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      redpanda: { condition: service_healthy }
