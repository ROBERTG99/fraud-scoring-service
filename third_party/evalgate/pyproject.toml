[project]
name = "evalgate"
version = "0.1.0.dev0"
description = "Minimal evalgate.report.v1 implementation used until ROBERTG99/evalgate v0.1.0 is tagged"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0", "pydantic>=2.10", "numpy>=2.0"]

[project.scripts]
evalgate = "evalgate.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalgate"]
