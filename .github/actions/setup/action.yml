name: setup
description: Go, Python (uv), Node (pnpm) and the pinned tools of scripts/bootstrap.sh, with caches.
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum
    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
    - uses: pnpm/action-setup@v6
      with:
        package_json_file: web/package.json
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: web/pnpm-lock.yaml
    - name: Cache pinned tools
      uses: actions/cache@v6
      with:
        path: |
          ~/go/bin
          .cache/bin
          ~/.local/bin
          ~/.local/share/uv/tools
        key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/bootstrap.sh', 'go.mod') }}
    - name: Bootstrap
      shell: bash
      run: |
        echo "$HOME/go/bin" >> "$GITHUB_PATH"
        echo "$PWD/.cache/bin" >> "$GITHUB_PATH"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        make bootstrap
