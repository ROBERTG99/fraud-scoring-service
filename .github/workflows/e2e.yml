name: e2e

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Stack up (docker compose up -d --build --wait)
        run: make up
      - name: Seed
        run: make seed
      - name: Playwright browsers
        run: pnpm -C web exec playwright install --with-deps chromium
      - name: Playwright and axe against the stack
        run: make e2e # the console on http://127.0.0.1:8500 (tests/e2e/playwright.config.ts)
      - name: Scripted demo
        run: DEMO_STACK=compose make demo
      - if: failure()
        run: docker compose logs --no-color > compose.log
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e
          path: |
            compose.log
            artifacts/demo/
            artifacts/e2e/
          if-no-files-found: ignore
      - if: always()
        run: docker compose down -v
