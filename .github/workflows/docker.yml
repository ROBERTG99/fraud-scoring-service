name: docker

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds every image of the stack, then `make security`: hadolint, checkov (Dockerfiles), trivy (HIGH and
  # CRITICAL vulnerabilities, secrets) on each built image, plus gitleaks, gosec, govulncheck, bandit,
  # pip-audit, pnpm audit, tflint, actionlint and the licence check.
  build-and-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks scans the history
      - uses: ./.github/actions/setup
      - name: Build images
        run: |
          docker compose build
          docker compose --profile seed --profile jobs build seed retention
          docker compose -f compose.test.yaml -p fraudtest --profile docker build tests
      - name: Security scans (hadolint, trivy and the rest)
        run: make security
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security
          path: artifacts/security/
          if-no-files-found: ignore

  test-docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Full test suite inside containers
        run: make test-docker
      - if: always()
        run: make test-deps-down
