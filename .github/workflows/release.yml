name: release

# Tags are cut by the maintainer (`make release` / the release skill); this repository never pushes tags.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # the GitHub release and its SBOM assets
      packages: write # images to GHCR
      id-token: write # build provenance attestations
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: scorer, file: Dockerfile.go, target: scorer }
          - { name: feature-updater, file: Dockerfile.go, target: feature-updater }
          - { name: dev-issuer, file: Dockerfile.go, target: dev-issuer }
          - { name: webserve, file: Dockerfile.go, target: webserve }
          - { name: retention, file: Dockerfile.go, target: retention }
          - { name: case-summarizer, file: Dockerfile.summarizer, target: runtime }
          - { name: model-server, file: serving/bentoml/Dockerfile, target: runtime }
          - { name: mlflow, file: deploy/mlflow/Dockerfile, target: runtime }
          - { name: seed, file: deploy/seed/Dockerfile, target: seed }
          - { name: training, file: training/Dockerfile, target: runtime }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fraud-${{ matrix.name }}
          tags: type=semver,pattern={{version}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/fraud-${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: SBOM (SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/fraud-${{ matrix.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json
          upload-release-assets: false
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.spdx.json

  github-release:
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: sbom-*
          merge-multiple: true
      - name: Release with the SBOMs attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" sbom-*.spdx.json --verify-tag --title "$TAG" --notes-file CHANGELOG.md
