name: evals

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decisions and summaries through the released evalgate action, gated against the committed baselines.
  suites:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # the action upserts one report comment per suite
    strategy:
      fail-fast: false
      matrix:
        suite: [decisions, summaries]
    env:
      PYTHONPATH: ${{ github.workspace }}
      FRAUD_SUMMARY_PROVIDER: fake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      # The action installs evalgate into this same interpreter (same version), so the graders' imports
      # (this project and its dependencies) are installed first.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Project dependencies for the graders
        run: |
          uv export --frozen --no-default-groups --no-emit-project --no-hashes -o "$RUNNER_TEMP/req.txt"
          python -m pip install --quiet -r "$RUNNER_TEMP/req.txt"
          python -m pip install --quiet --no-deps .
      - uses: ROBERTG99/evalgate/action@0681335a1b6b842cb881583fdfa78d698f83375a # v0.1.0
        with:
          suite: evals/suites/${{ matrix.suite }}.yaml
          baseline: evals/reports/baseline/${{ matrix.suite }}.json
          split: test
          max-regression-pp: "1.0"
          python-version: "3.13"
          report-md: evalgate-${{ matrix.suite }}.md
          comment: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}

  # The full offline gate: model suite on the 2M-event eval data, every suite, the judge and REPORT.md.
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Demo data and model
        run: make train
      - run: make eval
      - name: REPORT.md is generated from this run
        run: git diff --stat -- evals/REPORT.md
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evals
          path: |
            evals/REPORT.md
            evals/reports/*.json
          if-no-files-found: ignore
