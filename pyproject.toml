[project]
name = "fraud-scoring-service"
version = "0.1.0"
description = "Case summarizer, training pipeline and evaluation tooling for the fraud scoring service"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
  "aiokafka[lz4,snappy,zstd]>=0.12",
  "anthropic>=0.70",
  "fastapi>=0.115",
  "httpx>=0.28",
  "jsonschema>=4.23",
  "openai>=1.100",
  "opentelemetry-api>=1.30",
  "opentelemetry-sdk>=1.30",
  "prometheus-client>=0.21",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.10",
  "pyjwt[crypto]>=2.10",
  "pyyaml>=6.0",
  "uvicorn>=0.32",
]

[dependency-groups]
training = [
  "boto3>=1.35",
  "mlflow>=2.20",
  "numpy>=2.0",
  "onnx>=1.17",
  "onnxmltools>=1.13",
  "onnxruntime>=1.20",
  "orjson>=3.10",
  "skl2onnx>=1.18",
  "scikit-learn>=1.6",
  "xgboost-cpu>=3.0",
]
serving = [
  "bentoml>=1.4",
  "mlflow-skinny>=3.0",
  "numpy>=2.0",
  "onnxruntime>=1.20",
]
dev = [
  "bandit>=1.8",
  "evalgate",
  "hypothesis>=6.120",
  "moto[s3,sagemaker,iam,ecr]>=5.0",
  "mypy>=1.13",
  "pip-audit>=2.7",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "pytest-socket>=0.7",
  "ruff>=0.8",
  "schemathesis>=3.38",
  "types-pyyaml>=6.0",
  "types-jsonschema>=4.23",
]

[tool.uv]
default-groups = ["dev", "training", "serving"]

[tool.uv.sources]
evalgate = { path = "third_party/evalgate", editable = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_summarizer", "training"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["web", "gen", "third_party/evalgate/build", ".cache", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL", "PT", "ASYNC"]
ignore = ["E501", "PLR0917", "PLC0415", "PLR0913", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "PT011", "PT018", "PLC0415"]
"scripts/**" = ["S603", "S607", "T201"]
".claude/hooks/**" = ["S108"]
"evals/**" = ["S"]

[tool.ruff.lint.isort]
known-first-party = ["fraud_summarizer", "training", "evalgate"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
mypy_path = ["src", "."]
explicit_package_bases = true
exclude = ["build/", "web/", "\\.cache/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "slow: long-running test excluded from make check-fast",
  "integration: needs Postgres/Redis/Kafka from compose.test.yaml",
  "enable_socket: allow network for this test (local services only)",
]
addopts = "--disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,localhost,::1"
filterwarnings = ["ignore::DeprecationWarning:mlflow.*", "ignore::DeprecationWarning:bentoml.*", "ignore::DeprecationWarning:_bentoml_sdk.*", "ignore::DeprecationWarning:_bentoml_impl.*"]

[tool.coverage.run]
branch = false
omit = ["*/tests/*"]

[tool.bandit]
exclude_dirs = ["tests", "web", ".venv", "third_party/evalgate/tests"]
skips = ["B101"]
