# Feature spec v1 — read by Go (internal/features) and Python (training/features.py).
# Order of `features` is the model input order (13 float32 columns).
# Every feature is point-in-time: computed from events with event_ts strictly before the transaction's
# event_ts (as_of), then the transaction itself is added (score_tx.lua / offline replay).
schema: fraud.features.v1
version: v1

sources:
  tx: transactions (ZSET fr:{acc}:tx, member "event_id|amount_minor", score event_ts_ms)
  dev: device_id of successful logins, device_bound events and transactions (ZSET fr:{acc}:dev, ZADD GT)
  mcc: mcc of transactions (ZSET fr:{acc}:mcc, ZADD GT)
  cred: password_changed / email_changed device events (HASH fr:{acc}:cred, keep the latest)

retention_ms:
  tx: 87000000 # 24 h 5 min
  dev: 7776000000 # 90 d
  mcc: 2592000000 # 30 d
  cred_ttl: 7862400000 # 91 d

channel_codes: { CARD_PRESENT: 1, ECOMMERCE: 2, P2P: 3 }

features:
  - { name: tx_count_10m, kind: tx_count, window_ms: 600000 }
  - { name: tx_count_1h, kind: tx_count, window_ms: 3600000 }
  - { name: tx_count_24h, kind: tx_count, window_ms: 86400000 }
  - { name: amount_sum_1h_minor, kind: tx_amount_sum, window_ms: 3600000 }
  - { name: amount_minor, kind: current_amount }
  - { name: distinct_devices_24h, kind: distinct_devices, window_ms: 86400000 }
  - { name: new_device, kind: new_device, window_ms: 7776000000 }
  - { name: minutes_since_pwd_change, kind: minutes_since, field: pwd_changed_ms, cap: 43200 }
  - { name: minutes_since_email_change, kind: minutes_since, field: email_changed_ms, cap: 43200 }
  - { name: mcc_novel_30d, kind: mcc_novel, window_ms: 2592000000 }
  - { name: channel, kind: channel_code }
  - { name: hour_of_day_utc, kind: hour_of_day }
  - { name: amount_ratio_24h, kind: amount_ratio, window_ms: 86400000 }

# Definitions (window [as_of - window_ms, as_of), as_of exclusive):
#   tx_count       = number of transactions in the window
#   tx_amount_sum  = sum of amount_minor in the window
#   distinct_devices = devices whose last sighting is in the window
#   new_device     = 1 if the transaction's device has no sighting in the window, else 0
#   minutes_since  = floor((as_of - latest change before as_of) / 60000), capped; cap when none
#   mcc_novel      = 1 if the transaction's MCC was not seen in the window, else 0
#   amount_ratio   = amount_minor / (sum_24h / count_24h), 1.0 when count_24h = 0

# Conservative defaults used when Redis is unavailable (FEATURES_UNAVAILABLE).
# Written by training/train.py from the training split (p90 of each feature); do not edit by hand.
fallback_defaults:
  tx_count_10m: 0
  tx_count_1h: 1
  tx_count_24h: 5
  amount_sum_1h_minor: 928
  distinct_devices_24h: 2
  new_device: 0
  minutes_since_pwd_change: 43200
  minutes_since_email_change: 43200
  mcc_novel_30d: 1
